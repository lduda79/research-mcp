# ---------------------------------------------------------------------------
# research-mcp configuration
#
# Copy this file to "config.yaml" and adjust the paths. Without a config.yaml
# the server falls back to the classic data/ layout (data/papers, ...).
#
# ~ expands to your home directory. Relative paths are taken from the
# research-mcp folder itself.
# ---------------------------------------------------------------------------

# The vector database. Kept inside research-mcp - it is a derived index, not
# source material you edit by hand. All projects share it (separated by the
# "project" column).
database: library.db

# Default subfolder names inside each project. If you name your folders the
# same way everywhere, you only need to give each project its "root" below.
defaults:
  papers: papers
  experiments: experiments
  thesis: text

# Your projects. Each needs a "root"; the three folders are derived from the
# defaults unless you override them. Set a folder to null if a project does
# not have it.
projects:
  my_project:
    root: ~/Desktop/my_project
    # uses defaults: papers, experiments, text

    # --- Optional: let the server read this project's source code ------------
    # Off by default. Set to true so read_code / list_code can open this
    # project's files (e.g. to get help with your training code). Even when
    # true, secret files (.env, *.pem, *.key, id_rsa, ...) are never readable,
    # and you can exclude further files or folders explicitly:
    #
    # read_code_allowed: true
    # read_code_exclude:
    #   - .env
    #   - secrets/
    #   - config/credentials.py

  # Example of a second project with different folder names:
  # my_other_project:
  #   root: ~/Desktop/my_other_project
  #   papers: papers
  #   experiments: runs
  #   thesis: null