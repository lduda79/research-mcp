[project]
name = "research-mcp"
version = "0.1.0"
description = "Local MCP server for a personal research stack: papers, experiments, thesis"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.1",
    "mcp[cli]>=1.28.1",
    "numpy>=2.4.4",
    "pymupdf>=1.28.0",
    "pyyaml>=6.0",
    "sentence-transformers>=5.6.0",
    "sqlite-vec>=0.1.9",
    "torch>=2.13.0",
]

[[tool.uv.index]]
url = "https://download.pytorch.org/whl/cpu"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
